name: Validate Android source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-android-source.yml"
      - "android/**"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "settings.gradle.kts"
  pull_request:
    paths:
      - ".github/workflows/validate-android-source.yml"
      - "android/**"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "settings.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-android-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Unit tests and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run source-only unit tests and lint
        run: |
          ./gradlew --no-daemon -ParchpheneSourceValidation=true \
            :android:app:testDebugUnitTest \
            :android:launcher-template:testDebugUnitTest \
            :android:builder:testDebugUnitTest \
            :android:app:lintDebug \
            :android:launcher-template:lintDebug \
            :android:builder:lintDebug
