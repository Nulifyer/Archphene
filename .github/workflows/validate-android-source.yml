name: Validate Android source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-android-source.yml"
      - "android/**"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "settings.gradle.kts"
  pull_request:
    paths:
      - ".github/workflows/validate-android-source.yml"
      - "android/**"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "settings.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-android-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Unit tests and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run source-only unit tests and lint
        run: |
          ./gradlew --no-daemon -ParchpheneSourceValidation=true \
            :android:app:testDebugUnitTest \
            :android:launcher-template:testDebugUnitTest \
            :android:builder:testDebugUnitTest \
            :android:app:lintDebug \
            :android:launcher-template:lintDebug \
            :android:builder:lintDebug
