name: Validate source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Repository and source contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Validate public repository and release contracts
        run: |
          find scripts research -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash scripts/test-bash-test-helpers.sh
          python3 scripts/test-public-repository.py
          python3 scripts/test-release-workflow-contract.py
          python3 scripts/test-android-source-workflow-contract.py
          python3 scripts/test-trust-policy-contract.py
          python3 scripts/test-runtime-lifecycle-contract.py
          python3 scripts/test-launcher-notification-contract.py
          python3 scripts/test-launcher-intent-contract.py
          python3 scripts/test-launcher-visibility-contract.py
          python3 scripts/test-quick-launch-contract.py
      - name: Validate private AT-SPI source contract
        run: python3 scripts/test-atspi-source-contract.py
      - name: Validate runtime-pack source contract
        run: python3 scripts/test-runtime-pack-source-contract.py
      - name: Validate scoped-storage source contract
        run: python3 scripts/test-storage-permission-contract.py
