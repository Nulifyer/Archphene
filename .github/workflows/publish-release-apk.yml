name: Publish Archphene APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to receive the APK
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and attach signed APK
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_BASE64: ${{ secrets.ARCHPHENE_RELEASE_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ARCHPHENE_RELEASE_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ARCHPHENE_RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ARCHPHENE_RELEASE_KEY_PASSWORD }}
      DEBUGGABLE: "false"

    steps:
      - name: Check out release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Resolve release version
        run: |
          if [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)([-+][0-9A-Za-z.-]+)?$ ]]; then
            version_name="${RELEASE_TAG#v}"
          else
            echo "Release tag must use vMAJOR.MINOR.PATCH syntax" >&2
            exit 1
          fi
          if (( GITHUB_RUN_NUMBER >= 1000000000 )); then
            echo "GitHub run number exceeds Android versionCode range" >&2
            exit 1
          fi
          {
            echo "VERSION_NAME=$version_name"
            echo "VERSION_CODE=$((1000000000 + GITHUB_RUN_NUMBER))"
            echo "SOURCE_REVISION=$(git rev-parse HEAD)"
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
            echo "APK_X86_NAME=Archphene-x86_64-$version_name.apk"
            echo "APK_ARM64_NAME=Archphene-arm64-v8a-$version_name.apk"
            echo "BUILDER_X86_NAME=Archphene-Builder-x86_64-$version_name.apk"
            echo "BUILDER_ARM64_NAME=Archphene-Builder-arm64-v8a-$version_name.apk"
            echo "NATIVE_LICENSE_NAME=Archphene-native-licenses-$version_name.zip"
            echo "GLIBC_SOURCE_NAME=Archphene-glibc-source-$version_name.zip"
            echo "TERMUX_SOURCE_NAME=Archphene-termux-pulse-source-$version_name.zip"
          } >> "$GITHUB_ENV"

      - name: Validate release contracts
        run: |
          python3 scripts/test-release-workflow-contract.py
          python3 scripts/test-release-rust-components.py
          python3 scripts/test-release-rust-licenses.py
          python3 scripts/test-release-sbom.py
          python3 scripts/test-release-license-contract.py
          python3 scripts/test-release-native-audit.py
          python3 scripts/test-release-native-licenses.py
          python3 scripts/test-release-glibc-source.py
          python3 scripts/test-qt-prebuilt-provenance.py
          python3 scripts/test-legacy-migration-contract.py
          python3 scripts/test-atspi-source-contract.py

      - name: Verify Qt prebuilt reproducibility
        run: CONTAINER_CLI=docker bash scripts/test-qt-prebuilt-reproducibility.sh

      - name: Verify Termux Pulse source recipes
        run: |
          source=tooling/external/termux-packages-release
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/termux/termux-packages.git "$source"
          git -C "$source" sparse-checkout init --cone
          git -C "$source" sparse-checkout set packages
          git -C "$source" checkout --quiet HEAD
          python3 scripts/release-termux-pulse-audit.py --repository "$source"
          bundle="$RUNNER_TEMP/$TERMUX_SOURCE_NAME"
          python3 scripts/release-termux-pulse-source.py generate \
            --manifest release/termux-pulse-recipes.json \
            --repository "$source" \
            --cache tooling/downloads/termux-pulse-source \
            --source-date-epoch "$SOURCE_DATE_EPOCH" --output "$bundle"
          python3 scripts/release-termux-pulse-source.py verify \
            --manifest release/termux-pulse-recipes.json \
            --repository "$source" \
            --cache tooling/downloads/termux-pulse-source \
            --source-date-epoch "$SOURCE_DATE_EPOCH" --output "$bundle"
          sha256sum "$bundle" | sed "s|  .*|  $TERMUX_SOURCE_NAME|" \
            > "$bundle.sha256"

      - name: Require complete native release audit
        run: python3 scripts/release-native-audit.py --require-complete

      - name: Ensure release is a draft
        run: |
          state="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ -z "$state" ]]; then
            args=(
              --verify-tag
              --draft
              --notes-file docs/release-notes.md
              --title "Archphene $RELEASE_TAG"
            )
            if [[ "$VERSION_NAME" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          elif [[ "$state" != true ]]; then
            echo "Release $RELEASE_TAG is already published; release assets are immutable" >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Linux container engine
        run: docker version

      - name: Build verified Arch runtimes and patched glibc
        run: |
          bash scripts/build-ci-package-runtime.sh
          bash scripts/build-ci-package-runtime-arm64.sh

      - name: Build greenfield Rust JNI and compositor
        run: |
          docker build -f containers/android-native.Containerfile \
            -t archphene-android-native:release .
          for target in x86_64-linux-android aarch64-linux-android; do
            docker run --rm \
              -v "$PWD:/workspace" \
              -v archphene-cargo-registry:/opt/cargo/registry \
              -w /workspace \
              -e CARGO_TARGET_DIR=/workspace/tooling/build/release-rust \
              -e RUSTUP_TOOLCHAIN=1.88.0 \
              archphene-android-native:release \
              bash -lc "ndk_bin=\$ANDROID_SDK_ROOT/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin; \
                export CC_x86_64_linux_android=\$ndk_bin/x86_64-linux-android29-clang; \
                export CXX_x86_64_linux_android=\$ndk_bin/x86_64-linux-android29-clang++; \
                export AR_x86_64_linux_android=\$ndk_bin/llvm-ar; \
                export CC_aarch64_linux_android=\$ndk_bin/aarch64-linux-android29-clang; \
                export CXX_aarch64_linux_android=\$ndk_bin/aarch64-linux-android29-clang++; \
                export AR_aarch64_linux_android=\$ndk_bin/llvm-ar; \
                cargo build --target $target --release --locked \
                -p archphene-android -p archphene-builder -p archphene-compositor"
          done
          for entry in \
            x86_64-linux-android:x86_64 \
            aarch64-linux-android:arm64-v8a; do
            target="${entry%%:*}"
            abi="${entry##*:}"
            install -Dm755 \
              "tooling/build/release-rust/$target/release/libarchphene_android.so" \
              "android/app/build/generated/jniLibs/$abi/libarchphene_android.so"
            install -Dm755 \
              "tooling/build/release-rust/$target/release/libarchphene_builder.so" \
              "android/builder/build/generated/jniLibs/$abi/libarchphene_builder.so"
            install -Dm755 \
              "tooling/build/release-rust/$target/release/libarchphene_compositor.so" \
              "android/app/build/generated/compositorJniLibs/$abi/libarchphene_compositor.so"
          done
          component_dir=tooling/build/release-rust-components
          mkdir -p "$component_dir"
          for target in x86_64-linux-android aarch64-linux-android; do
            metadata="$component_dir/metadata-$target.json"
            docker run --rm --network=none \
              -v "$PWD:/workspace" \
              -v archphene-cargo-registry:/opt/cargo/registry \
              -w /workspace \
              -e RUSTUP_TOOLCHAIN=1.88.0 \
              archphene-android-native:release \
              cargo metadata --offline --locked \
                --filter-platform "$target" --format-version 1 > "$metadata"
            python3 scripts/release-rust-components.py \
              --metadata "$metadata" --lock Cargo.lock --target "$target" \
              --root archphene-android --root archphene-compositor \
              --output "$component_dir/manager-$target.json"
            python3 scripts/release-rust-components.py \
              --metadata "$metadata" --lock Cargo.lock --target "$target" \
              --root archphene-builder \
              --output "$component_dir/builder-$target.json"
            for role in manager builder; do
              bundle="$component_dir/$role-$target-rust-licenses.zip"
              docker run --rm --network=none \
                -v "$PWD:/workspace" \
                -v archphene-cargo-registry:/opt/cargo/registry \
                -w /workspace \
                archphene-android-native:release \
                python3 scripts/release-rust-licenses.py generate \
                  --components "$component_dir/$role-$target.json" \
                  --cargo-registry /opt/cargo/registry \
                  --source-date-epoch "$SOURCE_DATE_EPOCH" \
                  --output "$bundle"
              docker run --rm --network=none \
                -v "$PWD:/workspace" \
                -v archphene-cargo-registry:/opt/cargo/registry \
                -w /workspace \
                archphene-android-native:release \
                python3 scripts/release-rust-licenses.py verify \
                  --components "$component_dir/$role-$target.json" \
                  --cargo-registry /opt/cargo/registry \
                  --source-date-epoch "$SOURCE_DATE_EPOCH" \
                  --output "$bundle"
            done
            rm "$metadata"
          done

      - name: Build Android capability and desktop integration payloads
        run: |
          docker build -f containers/arm-runtime-builder.Containerfile \
            -t archphene-arm-runtime-builder:release .
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            archlinux:base-devel bash -lc '
              set -euo pipefail
              mkdir -p tooling/build/android-capability/x86_64
              gcc -shared -fPIC -O2 -Wall -Wextra -Werror \
                -o tooling/build/android-capability/x86_64/libarchphene_android.so \
                native/archphene-android-capability/archphene_android.c
            '
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            archphene-arm-runtime-builder:release bash -lc '
              set -euo pipefail
              mkdir -p tooling/build/android-capability/aarch64
              aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -Wextra -Werror \
                -o tooling/build/android-capability/aarch64/libarchphene_android.so \
                native/archphene-android-capability/archphene_android.c
            '
          for architecture in x86_64 aarch64; do
            docker run --rm \
              -v "$PWD:/workspace" -w /workspace \
              archphene-android-native:release \
              bash scripts/build-android-dbus.sh "$architecture"
            docker run --rm \
              -v "$PWD:/workspace" -w /workspace \
              archphene-android-native:release \
              bash scripts/build-android-pulse.sh "$architecture"
          done

      - name: Build pinned private PipeWire camera runtimes
        run: |
          source_dir=tooling/external/pipewire
          expected=b741e0c74f5436f0c925f7741140db0efd32cf4e
          mkdir -p "$source_dir"
          git -C "$source_dir" init
          git -C "$source_dir" remote add origin \
            https://gitlab.freedesktop.org/pipewire/pipewire.git
          git -C "$source_dir" fetch --depth=1 origin "$expected"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$expected"
          for architecture in x86_64 aarch64; do
            docker run --rm \
              -v "$PWD:/workspace" -w /workspace \
              archphene-arm-runtime-builder:release bash -lc \
              "pacman -Sy --noconfirm --needed meson >/dev/null && \
               bash scripts/build-pipewire-camera-runtime.sh $architecture"
          done

      - name: Verify Termux Pulse binary inputs
        run: |
          python3 scripts/release-termux-pulse-audit.py \
            --repository tooling/external/termux-packages-release \
            --verify-binaries

      - name: Test private PipeWire camera runtime
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            archlinux:base-devel bash -lc \
            "pacman -Sy --noconfirm --needed pipewire gstreamer \
             gst-plugin-pipewire gst-plugins-base jq >/dev/null && \
             bash scripts/test-pipewire-camera-runtime.sh"

      - name: Build Android GPU helpers
        run: |
          for architecture in x86_64 aarch64; do
            docker run --rm \
              -v "$PWD:/workspace" \
              -w /workspace \
              archphene-android-native:release \
              bash scripts/build-android-gpu-helper.sh "$architecture"
          done

      - name: Build glibc corresponding source
        env:
          GLIBC_COMMIT: 7cba77790f3279bec3ac20e9c7632b021cd53f95
        run: |
          glibc_source=tooling/external/glibc-release
          mkdir -p "$glibc_source"
          git -C "$glibc_source" init --quiet
          git -C "$glibc_source" remote add origin \
            https://sourceware.org/git/glibc.git
          git -C "$glibc_source" fetch --quiet --depth 1 origin "$GLIBC_COMMIT"
          git -C "$glibc_source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$glibc_source" rev-parse HEAD)" = "$GLIBC_COMMIT"
          glibc_bundle="$RUNNER_TEMP/$GLIBC_SOURCE_NAME"
          python3 scripts/release-glibc-source.py generate \
            --source "$glibc_source" --repository . --commit "$GLIBC_COMMIT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" --output "$glibc_bundle"
          python3 scripts/release-glibc-source.py verify \
            --source "$glibc_source" --repository . --commit "$GLIBC_COMMIT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" --output "$glibc_bundle"
          sha256sum "$glibc_bundle" | \
            sed "s|  .*|  $GLIBC_SOURCE_NAME|" > "$glibc_bundle.sha256"

      - name: Build verified native license bundle
        run: |
          native_licenses="$RUNNER_TEMP/$NATIVE_LICENSE_NAME"
          python3 scripts/release-native-licenses.py generate \
            --manifest release/native-components.json \
            --root . \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --output "$native_licenses"
          python3 scripts/release-native-licenses.py verify \
            --manifest release/native-components.json \
            --root . \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --output "$native_licenses"
          sha256sum "$native_licenses" | \
            sed "s|  .*|  $NATIVE_LICENSE_NAME|" \
            > "$native_licenses.sha256"
      - name: Restore release signing key
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name}" ]] || {
              echo "Required release signing secret $name is missing" >&2
              exit 1
            }
          done
          key_path="$RUNNER_TEMP/archphene-release.keystore"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_path"
          echo "KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build signed ABI-specific APKs on Linux
        run: |
          for abi in x86_64 arm64-v8a; do
            if [[ "$abi" == "x86_64" ]]; then
              name="$APK_X86_NAME"
              builder_name="$BUILDER_X86_NAME"
            else
              name="$APK_ARM64_NAME"
              builder_name="$BUILDER_ARM64_NAME"
            fi
            bash scripts/build-archphene-release-apk.sh \
              --abi "$abi" \
              --version-code "$VERSION_CODE" \
              --version-name "$VERSION_NAME" \
              --prebuilt-native
            unsigned="tooling/build/apk/Archphene-$abi-$VERSION_NAME-unsigned.apk"
            builder_unsigned="tooling/build/apk/Archphene-Builder-$abi-$VERSION_NAME-unsigned.apk"
            aligned="$RUNNER_TEMP/Archphene-$abi-aligned.apk"
            builder_aligned="$RUNNER_TEMP/Archphene-Builder-$abi-aligned.apk"
            asset="$RUNNER_TEMP/$name"
            builder_asset="$RUNNER_TEMP/$builder_name"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
              -P 16 -f 4 "$unsigned" "$aligned"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
              -P 16 -f 4 "$builder_unsigned" "$builder_aligned"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "$asset" \
              "$aligned"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "$builder_asset" \
              "$builder_aligned"
            bash scripts/verify-release-apk.sh \
              "$asset" \
              "$builder_asset" \
              "$abi" "$VERSION_NAME"
          done

      - name: Verify release artifacts
        run: |
          for name in \
            "$APK_X86_NAME" "$APK_ARM64_NAME" \
            "$BUILDER_X86_NAME" "$BUILDER_ARM64_NAME"; do
            asset="$RUNNER_TEMP/$name"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
              verify --verbose --print-certs "$asset"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
              -c -P 16 -v 4 "$asset"
            sha256sum "$asset" | sed "s|  .*|  $name|" \
              > "$asset.sha256"
            if [[ "$name" == *-arm64-v8a-* ]]; then
              rust_target=aarch64-linux-android
            else
              rust_target=x86_64-linux-android
            fi
            if [[ "$name" == Archphene-Builder-* ]]; then
              component_role=builder
            else
              component_role=manager
            fi
            components="tooling/build/release-rust-components/$component_role-$rust_target.json"
            license_source="tooling/build/release-rust-components/$component_role-$rust_target-rust-licenses.zip"
            license_bundle="$asset.rust-licenses.zip"
            install -m644 "$license_source" "$license_bundle"
            cmp "$license_source" "$license_bundle"
            sha256sum "$license_bundle" | \
              sed "s|  .*|  $name.rust-licenses.zip|" \
              > "$license_bundle.sha256"
            sbom="$asset.spdx.json"
            python3 scripts/release-sbom.py generate \
              --apk "$asset" \
              --artifact-name "$name" \
              --version "$VERSION_NAME" \
              --source-revision "$SOURCE_REVISION" \
              --source-date-epoch "$SOURCE_DATE_EPOCH" \
              --rust-components "$components" \
              --rust-target "$rust_target" \
              --rust-license-bundle "$license_bundle" \
              --output "$sbom"
            python3 scripts/release-sbom.py verify \
              --apk "$asset" \
              --sbom "$sbom" \
              --artifact-name "$name" \
              --version "$VERSION_NAME" \
              --source-revision "$SOURCE_REVISION" \
              --rust-components "$components" \
              --rust-target "$rust_target" \
              --rust-license-bundle "$license_bundle"
            sha256sum "$sbom" | sed "s|  .*|  $name.spdx.json|" \
              > "$sbom.sha256"
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Archphene-${{ env.VERSION_NAME }}
          path: |
            ${{ runner.temp }}/Archphene-*.apk
            ${{ runner.temp }}/Archphene-*.apk.sha256
            ${{ runner.temp }}/Archphene-*.apk.spdx.json
            ${{ runner.temp }}/Archphene-*.apk.spdx.json.sha256
            ${{ runner.temp }}/Archphene-*.apk.rust-licenses.zip
            ${{ runner.temp }}/Archphene-*.apk.rust-licenses.zip.sha256
            ${{ runner.temp }}/Archphene-native-licenses-*.zip
            ${{ runner.temp }}/Archphene-native-licenses-*.zip.sha256
            ${{ runner.temp }}/Archphene-glibc-source-*.zip
            ${{ runner.temp }}/Archphene-glibc-source-*.zip.sha256
            ${{ runner.temp }}/Archphene-termux-pulse-source-*.zip
            ${{ runner.temp }}/Archphene-termux-pulse-source-*.zip.sha256
          if-no-files-found: error

      - name: Attach APKs and publish release
        run: |
          assets=()
          assets+=(
            "$RUNNER_TEMP/$NATIVE_LICENSE_NAME"
            "$RUNNER_TEMP/$NATIVE_LICENSE_NAME.sha256"
            "$RUNNER_TEMP/$GLIBC_SOURCE_NAME"
            "$RUNNER_TEMP/$GLIBC_SOURCE_NAME.sha256"
            "$RUNNER_TEMP/$TERMUX_SOURCE_NAME"
            "$RUNNER_TEMP/$TERMUX_SOURCE_NAME.sha256"
          )
          for name in \
            "$APK_X86_NAME" "$APK_ARM64_NAME" \
            "$BUILDER_X86_NAME" "$BUILDER_ARM64_NAME"; do
            assets+=(
              "$RUNNER_TEMP/$name"
              "$RUNNER_TEMP/$name.sha256"
              "$RUNNER_TEMP/$name.spdx.json"
              "$RUNNER_TEMP/$name.spdx.json.sha256"
              "$RUNNER_TEMP/$name.rust-licenses.zip"
              "$RUNNER_TEMP/$name.rust-licenses.zip.sha256"
            )
          done
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
