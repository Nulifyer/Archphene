[workspace]
members = [
    "crates/archphene-android",
    "crates/archphene-builder",
    "crates/archphene-core",
    "crates/archphene-jobs",
    "crates/archphene-launcher",
    "crates/archphene-packages",
    "crates/archphene-process",
    "crates/archphene-root",
    "crates/archphene-runtime",
    "crates/archphene-storage",
    "crates/archphene-terminal",
    "native/archphene-compositor",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
